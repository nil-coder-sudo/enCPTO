name: Release

# Push a tag like v8.0.0 to build installers for every platform and publish
# them as a GitHub Release. Pull requests that touch packaging build the
# installers as artifacts only (nothing is published), and it can be run by hand.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "CMakeLists.txt"
      - "src/app/CMakeLists.txt"
      - "src/app/resources/**"
      - "vcpkg.json"
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.8.*"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-release-${{ hashFiles('vcpkg.json') }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -A x64 -DENCPTO_BUILD_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $dir = "enCPTO-$ver-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build/src/app/Release/enCPTO.exe $dir
          Copy-Item build/src/cli/Release/encpto-cli.exe $dir
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw "$dir/enCPTO.exe"
          Copy-Item LICENSE, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: enCPTO-*-windows-x64.zip

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install ninja pkg-config openssl@3 libsodium
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENCPTO_BUILD_TESTS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$(brew --prefix openssl@3)"
          cmake --build build --parallel
      - name: Package
        run: |
          ver=$(sed -nE 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          app=build/src/app/enCPTO.app
          cp build/src/cli/encpto-cli "$app/Contents/MacOS/"
          macdeployqt "$app" -executable="$app/Contents/MacOS/encpto-cli"
          # Every non-system library must now live inside the bundle.
          if find "$app/Contents" -type f \( -perm -u+x -o -name "*.dylib" \) -exec otool -L {} \; 2>/dev/null \
               | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)|$QT_ROOT_DIR"; then
            echo "::error::Unbundled dependency in the app bundle"; exit 1
          fi
          codesign --force --deep --sign - "$app"   # ad-hoc signature (required on Apple Silicon)
          mkdir dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "enCPTO $ver" -srcfolder dmg -ov -format UDZO "enCPTO-$ver-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: enCPTO-*-macos-arm64.dmg

  linux:
    name: Linux x86-64 (AppImage)
    runs-on: ubuntu-22.04   # oldest supported glibc → widest compatibility
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libssl-dev \
            libsodium-dev libgl1-mesa-dev libfuse2 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENCPTO_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel
          DESTDIR=$PWD/AppDir cmake --install build
      - name: Package
        run: |
          ver=$(sed -nE 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLo linuxdeploy-plugin-qt $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE="$QT_ROOT_DIR/bin/qmake" LDAI_OUTPUT="enCPTO-$ver-linux-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/encpto.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/encpto.svg
          tar -C AppDir/usr/bin -czf "encpto-cli-$ver-linux-x86_64.tar.gz" encpto-cli
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            enCPTO-*-linux-x86_64.AppImage
            encpto-cli-*-linux-x86_64.tar.gz

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: enCPTO ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*
